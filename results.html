.card-stage{transition:opacity 1s ease,transform 1.15s cubic-bezier(.2,.8,.2,1),filter 1s ease;margin-top:4px}

<script>
const D={profiles:{
 Visionary:{title:"Visionary Builder",icon:"💡",description:"You see possibilities before they're obvious to everyone else—and you're drawn to ideas that can create meaningful change.",heroDescription:"You see what’s possible, imagine what could be, and inspire others to build a better future through creativity and big-picture thinking.",challenge:"Your biggest opportunity may not be finding another idea. It may be turning the right idea into action.",path:"VISION → OPPORTUNITY → ACTION"},
 Hustler:{title:"Hustler Builder",icon:"🔥",description:"You are wired for movement. You value independence, progress and the satisfaction of turning intention into results.",heroDescription:"You turn ownership and ambition into momentum by moving ideas toward measurable progress.",challenge:"Your next level may come from choosing the right opportunity—not simply moving faster.",path:"ACTION → OPPORTUNITY → MOMENTUM"},
 Creator:{title:"Creator Builder",icon:"🎨",description:"You naturally want to turn ideas into something tangible—solutions, businesses, projects and things people can use.",heroDescription:"You turn ideas into tangible solutions, projects and useful things people can experience.",challenge:"The right resources and people can help a strong idea move from concept to reality.",path:"IDEA → BUILD → IMPACT"},
 Network:{title:"Network Builder",icon:"🤝",description:"You understand that powerful things are rarely built alone. You naturally connect people, opportunities and shared goals.",heroDescription:"You naturally connect people, ideas and opportunities to turn relationships and shared goals into progress.",challenge:"Your opportunity is to turn strong relationships into coordinated action around something worth building.",path:"PEOPLE → OPPORTUNITY → COLLECTIVE ACTION"},
 Future:{title:"Future Builder",icon:"🚀",description:"You have ambition and potential, and you're still discovering the direction where you can make your biggest contribution.",heroDescription:"You are exploring what is next and discovering where your ambition can make the biggest contribution.",challenge:"You don't need to have the entire path figured out. Your next step is finding the direction worth exploring.",path:"DISCOVER → DIRECTION → BUILD"}
}};
Object.keys(D.profiles).forEach(key=>{const canonical=window.NOVAX_BUILDER_ARCHETYPES?.[key];if(canonical){D.profiles[key].icon=canonical.icon;D.profiles[key].strengths=canonical.strengths.slice();}});
const STATE_KEY="novax_builder_v4";
const state=(()=>{try{return JSON.parse(localStorage.getItem(STATE_KEY)||"null")}catch(e){return null}})();
if(!state||!state.email||!state.profile){location.replace("quiz.html");}else{
const profile=state.profile,p=D.profiles[profile]||D.profiles.Future,name=state.name||"Builder",score=Number(state.builderScore)||0,count=Math.max(0,Number(state.confirmedInviteCount)||0),inviteCode=state.inviteCode||makeInviteCode(name,state.email);
const el=id=>document.getElementById(id);
const SITE="https://meetnovax.com";
const inviteUrl=()=>`${SITE}/?ref=${encodeURIComponent(inviteCode)}`;
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
function makeInviteCode(n,e){let s=(n+e).toLowerCase(),h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h).toString(36).toUpperCase().slice(0,5).padStart(5,"0")}
const cardQuotes={Visionary:"I create meaningful change through innovation and real world impact.",Hustler:"I turn ambition into action, momentum and measurable progress.",Creator:"I bring ideas to life by creating useful things people can experience and use.",Network:"I connect people, opportunities and shared goals to create progress together.",Future:"I’m exploring what’s next and looking for the direction where I can make the biggest contribution."};
const topStrengthCopy={Visionary:"You see what could be, spot opportunity, and aim higher.",Hustler:"You take ownership, turn ideas into action, and keep moving forward.",Creator:"You create, solve problems, and turn ideas into something real.",Network:"You build relationships, create connections, and bring people together.",Future:"You stay curious, see your potential, and keep discovering what’s possible."};
function render(){
 el("profileTitle").textContent=`You're a ${p.title}™`;el("description").textContent=p.heroDescription||p.description;el("score").textContent=score;el("avatar").textContent=name.charAt(0).toUpperCase();el("accountName").textContent=(String(name).trim().split(/\s+/)[0]||"Builder");
 const heroTraits=p.strengths.slice(0,3);
 ["traitOne","traitTwo","traitThree"].forEach((id,i)=>{el(id).textContent=heroTraits[i]||"Your strengths";});
 const strengthMarkerFiles={"Vision":"assets/strength-markers/01-01-Big-picture-thinking.png","Opportunity":"assets/strength-markers/01-02-Opportunity-recognition.png","Ambition":"assets/strength-markers/01-03-Ambition.png","Execution":"assets/strength-markers/02-01-Execution.png","Ownership":"assets/strength-markers/02-02-Ownership.png","Momentum":"assets/strength-markers/02-03-Momentum.png","Create":"assets/strength-markers/03-01-Creation.png","Solve":"assets/strength-markers/03-02-Problem-solving.png","Build":"assets/strength-markers/03-03-Making-ideas-real.png","Relationships":"assets/strength-markers/04-01-Relationships.png","Connection":"assets/strength-markers/04-02-Connection.png","Collaboration":"assets/strength-markers/04-03-Collaboration.png","Curiosity":"assets/strength-markers/05-01-Curiosity.png","Potential":"assets/strength-markers/05-02-Potential.png","Discovery":"assets/strength-markers/05-03-Self-discovery.png"};const markerFor=t=>strengthMarkerFiles[t]||"";heroTraits.forEach((t,i)=>{const icon=el(["traitIconOne","traitIconTwo","traitIconThree"][i]);if(icon)icon.style.backgroundImage=markerFor(t)?`url("${markerFor(t)}")`:"none";});paintCard();
 
 el("results").hidden=false;
}
function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();return Promise.resolve()}
function shareMessage(){return `I just discovered my NovaX™ Builder Profile: ${p.title}™. What kind of Builder are you?\n\nDiscover yours → ${inviteUrl()}`}
async function shareCard(){const title=`${p.title}™ — NovaX™`;try{const file=await buildCardFile();if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title,text:shareMessage(),files:[file]});return}}catch(e){if(e?.name==="AbortError")return}try{if(navigator.share){await navigator.share({title,text:shareMessage().split("\n\nDiscover yours")[0],url:inviteUrl()});return}}catch(e){if(e?.name==="AbortError")return}await copyText(shareMessage());alert("Your Builder Card invite message and unique link were copied.")}
let cardRender=null,cardFilePromise=null;
const reduceMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
async function paintCard(){
 try{
  cardRender=await NovaXCard.prepare({profile,name,score,title:p.title,quote:cardQuotes[profile]||"Build what comes next.",strengths:p.strengths});
  const P=cardRender.palette,stage=el("cardStage"),cv=el("cardCanvas"),x=cv.getContext("2d");
  stage.style.setProperty("--aura-a",P.a);stage.style.setProperty("--aura-b",P.b);stage.style.setProperty("--aura-c",P.c);
  cardRender.draw(x,reduceMotion?1:0);if(!reduceMotion)stage.classList.add("pre");requestAnimationFrame(()=>cv.classList.add("ready"));
  const play=()=>{if(reduceMotion)return;stage.classList.remove("pre");const t0=performance.now()+700,D=1900;(function f(now){const t=Math.max(0,Math.min(1,(now-t0)/D));cardRender.draw(x,t);if(t<1)requestAnimationFrame(f);else stage.classList.add("flare")})(performance.now())};
  if("IntersectionObserver" in window&&!reduceMotion){const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();play()}},{threshold:.55});io.observe(stage)}else play();
  cv.setAttribute("aria-label",`NovaX Builder Card: ${name}, ${p.title}, Builder Score ${score}. Strengths: ${p.strengths.slice(0,3).join(", ")}.`);
  initTilt(stage);
  cardFilePromise=new Promise((res,rej)=>{const src=cardRender.full(),ex=document.createElement("canvas");ex.width=src.width;ex.height=src.height;const ec=ex.getContext("2d");ec.fillStyle="#04081a";ec.fillRect(0,0,ex.width,ex.height);ec.drawImage(src,0,0);ex.toBlob(bl=>bl?res(new File([bl],`NovaX-${profile}-Builder-Card.jpg`,{type:"image/jpeg"})):rej(new Error("Card export failed")),"image/jpeg",.92)});
 }catch(e){console.error(e)}
}
function initTilt(stage){
 if(reduceMotion)return;const card=el("builderCard");let tx=0,ty=0,cx=0,cy=0,raf=0,live=false,lastPointer=0;
 const apply=()=>{cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;card.style.transform=`perspective(1000px) rotateY(${(cx*9).toFixed(2)}deg) rotateX(${(-cy*9).toFixed(2)}deg)`;card.style.setProperty("--mx",(50+cx*100).toFixed(1)+"%");card.style.setProperty("--my",(50+cy*100).toFixed(1)+"%");
  if(Math.abs(tx-cx)>.002||Math.abs(ty-cy)>.002)raf=requestAnimationFrame(apply);else raf=0};
 const kick=()=>{if(!raf)raf=requestAnimationFrame(apply)};
 const aim=(px,py)=>{tx=Math.max(-.5,Math.min(.5,px));ty=Math.max(-.5,Math.min(.5,py));if(!live){live=true;card.classList.add("is-live")}kick()};
 const rest=()=>{tx=0;ty=0;live=false;card.classList.remove("is-live");kick()};
 stage.addEventListener("pointermove",e=>{lastPointer=Date.now();const r=stage.getBoundingClientRect();aim((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)});
 stage.addEventListener("pointerleave",rest);stage.addEventListener("pointercancel",rest);stage.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")rest()});
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=="function"){window.addEventListener("deviceorientation",e=>{if(Date.now()-lastPointer<1500||e.gamma==null)return;aim(Math.max(-1,Math.min(1,e.gamma/40))*.5,Math.max(-1,Math.min(1,(e.beta-45)/40))*.5)},{passive:true})}
}
async function buildCardFile(){if(!cardFilePromise)await paintCard();return cardFilePromise}
function openQr(){const url=inviteUrl();el("qrImage").src=`https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(url)}`;el("qrUrl").textContent=url;el("qrOverlay").classList.remove("hidden");el("qrOverlay").setAttribute("aria-hidden","false");setTimeout(()=>el("qrClose").focus(),0)}
function closeQr(){el("qrOverlay").classList.add("hidden");el("qrOverlay").setAttribute("aria-hidden","true")}
el("shareCard").onclick=shareCard;el("inviteNote").onclick=shareCard;el("topShare").onclick=shareCard;el("saveCard").onclick=async()=>{try{const file=await buildCardFile();const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){alert("Sorry — the Builder Card could not be saved.")}};el("showQr").onclick=openQr;el("qrClose").onclick=closeQr;el("qrOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeQr()});el("qrOverlay").onclick=e=>{if(e.target===el("qrOverlay"))closeQr()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeQr()});render();
}
</script>
</body>
</html>
